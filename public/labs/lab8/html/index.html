<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №8 - Рекламный слайдер Края</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Fullscreen Overlay -->
    <div id="fullscreen-overlay" class="hidden">
        <div class="overlay-content">
            <h1>Показ завершен!</h1>
            <p>Спасибо, что ознакомились с проектами компании "Minecraft Labs Inc."</p>
            <button id="btnRestart" class="btn btn-large">Повторить показ</button>
        </div>
    </div>

    <div class="container">
        <h2 class="title-banner">Презентация лабораторий (Измерение Края)</h2>

        <div class="controls-panel">
            <div class="input-group">
                <label>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 5px;"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/><path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    Задержка перед стартом (мс):
                </label>
                <input type="number" id="inputStartDelay" value="1000" min="0" step="500">
            </div>

            <div class="input-group">
                <label>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 5px;"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 7h4v4H5zm6 0h4v4h-4zm6 0h4v4h-4zM5 13h4v4H5zm6 0h4v4h-4zm6 0h4v4h-4z"/></svg>
                    Промежуток между картинками (мс):
                </label>
                <input type="number" id="inputDelay" value="2500" min="500" step="500">
            </div>

            <div class="button-group">
                <button id="btnStart" class="btn btn-play">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: bottom; margin-right: 5px;"><path d="M8 5v14l11-7z"/></svg>
                    Старт / Возобновить
                </button>
                <button id="btnStop" class="btn btn-stop">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: bottom; margin-right: 5px;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    Остановить
                </button>
            </div>
        </div>

        <div class="slider-frame">
            <div class="image-wrapper">
                <img id="slider-image" src="/images/slider_ad1.png" alt="Слайд">
                <div class="scanline"></div>
            </div>
            <div id="slider-caption" class="caption">Ожидание запуска...</div>
        </div>
    </div>
    
    <script src="../js/script.js"></script>
</body>
</html>
